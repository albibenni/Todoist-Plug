name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.21.2
              with:
                  node-version: '24'
                  cache: true
                  run-install: true

            - name: Check, test, and build
              run: vp run ci
